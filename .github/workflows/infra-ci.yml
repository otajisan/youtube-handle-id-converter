# infra(Terraform)の CI。#6 では WIF 認証 + init + plan の疎通確認のみ。
# fmt / validate / tflint / trivy / PR コメント / apply は #7 で追加する。
#
# - backend-ci と同様、PR では常に起動し infra/** に変更が無ければスキップする
# - fork PR では id-token が取れないため WIF 認証を伴うジョブはスキップする
name: infra

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      writable: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            infra:
              - "infra/**"
              - ".github/workflows/infra-ci.yml"

  plan:
    name: infra-plan
    needs: changes
    if: needs.changes.outputs.infra == 'true' && needs.changes.outputs.writable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF で GCP の OIDC トークン交換を行う
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color
