# backend の CI/CD: ktlint → test → Jacoco 閾値検証、依存グラフ送信 + 脆弱な依存の検出、Docker build、
# main への push では Artifact Registry へ push して Cloud Run の image を更新する
#
# - PR では常に起動し、backend/** に変更が無ければジョブを `if:` でスキップする。
#   ワークフロー自体を paths: で絞ると required check が pending のまま残りマージできなくなるため。
# - Actions は SHA で固定し、Dependabot(github-actions)が更新する。
# - fork からの PR では GITHUB_TOKEN が read-only のため、書き込みを伴う
#   ステップ(PR コメント、依存グラフ送信)はスキップする。
name: backend

on:
  pull_request:
  push:
    branches: [main]

# PR: 同じ PR の古い run は打ち切る / main: ref 単位で直列化しデプロイの順序を保つ
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      # 同一リポジトリからの PR / push なら true。fork PR では書き込み系ステップを抑止する
      writable: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/backend-ci.yml"

  check:
    name: backend-check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Jacoco のカバレッジ要約を PR にコメントする
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # main 以外ではキャッシュを書き込まず、ブランチごとのキャッシュ肥大を防ぐ
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: test + Jacoco
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Jacoco summary comment
        if: github.event_name == 'pull_request' && needs.changes.outputs.writable == 'true' && (success() || failure())
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "backend coverage"
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 7

  dependency-review:
    name: backend-dependency-review
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.writable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 依存グラフの送信(Dependency submission API)
      pull-requests: write # dependency-review の要約を PR にコメントする
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle は GitHub の依存グラフ自動解析の対象外なので、明示的に送信する。
      # main への push でも送信し、Dependabot alerts の対象にする
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: backend
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # 直前に送信したスナップショットの反映を待つ
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180

  docker-build:
    name: backend-docker-build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # ビルドできることだけを確認する。push は CD(#9)側で行う
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: false
          load: true
          tags: youtube-handle-id-converter-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # YOUTUBE_API_KEY が無いと起動時の検証で落ちる(fail-fast)ため、起動確認用のダミー値を渡す
          docker run -d --name backend -e YOUTUBE_API_KEY=ci-dummy youtube-handle-id-converter-backend:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Status}}' backend)
            if [ "$status" != "running" ]; then
              echo "::error::container exited early (status=$status)"; docker logs backend; docker rm -f backend; exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Health.Status}}' backend)" = "healthy" ]; then
              echo "healthy after ${i}0s"; docker rm -f backend; exit 0
            fi
            sleep 10
          done
          echo "::error::container did not become healthy"; docker logs backend; docker rm -f backend; exit 1

  deploy:
    name: backend-deploy
    needs: [changes, check, docker-build]
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # デプロイ可能ブランチを main に限定した Environment。CD 用 SA も main のトークンしか受け付けない
    environment: production
    permissions:
      contents: read
      id-token: write # WIF で GCP の OIDC トークン交換を行う
    env:
      IMAGE: ${{ vars.GCP_ARTIFACT_REGISTRY }}/${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP (WIF, deploy SA)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_EMAIL }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Cloud Run は amd64。docker-build ジョブの GHA キャッシュを再利用するので再ビルドは速い
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # image だけを差し替える。env / secret / probe / scaling は Terraform 管理(#8)
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          skip_default_labels: true # managed-by / commit-sha ラベルを付けない(Terraform の差分になる)

      # 新リビジョンが Ready でトラフィックを受けていること、URL が 5xx を返さないことを確認する。
      # /actuator/health は management ポート(非公開)なので外からは叩けない。
      # API エンドポイント実装後(#13)は実際の変換 API を叩くように更新する
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format='value(status.latestReadyRevisionName,status.latestCreatedRevisionName,status.traffic[0].percent,status.traffic[0].revisionName,status.traffic[0].latestRevision,spec.template.spec.containers[0].image)' \
            | tee describe.txt
          IFS=$'\t' read -r ready created percent traffic_rev traffic_latest image < describe.txt
          [ "$ready" = "$created" ] || { echo "::error::latest revision is not ready ($created != $ready)"; exit 1; }
          [ "$percent" = "100" ] || { echo "::error::traffic is not 100% ($percent)"; exit 1; }
          # トラフィックが特定リビジョンに固定されたまま(手動ロールバック後など)になっていないこと
          [ "$traffic_latest" = "True" ] || [ "$traffic_rev" = "$ready" ] || { echo "::error::traffic is pinned to $traffic_rev, not $ready"; exit 1; }
          [ "$image" = "$EXPECTED_IMAGE" ] || { echo "::error::image mismatch: $image"; exit 1; }
          # min instances 0 のためコールドスタート(最大 60 秒)を見込んでリトライする
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL/" || echo "000")
            echo "GET $URL/ -> $status (attempt $i)"
            if [ "$status" != "000" ] && [ "$status" -lt 500 ]; then exit 0; fi
            sleep 10
          done
          echo "::error::service did not respond successfully"; exit 1
