# 依存関係の version updates。
# 脆弱性起因の security updates はリポジトリ設定(Dependabot security updates)側で有効化している。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "infra"]

  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "backend"]
    groups:
      # Kotlin の jvm / plugin.spring は同時に上げないとビルドが壊れる
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
      spring:
        patterns: ["org.springframework.boot*"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "backend"]

  # pnpm-lock.yaml も "npm" エコシステムが扱う
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "frontend"]
    groups:
      # react / react-dom / 型定義は同一バージョンでないと動かない
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # 型定義・Lint 系はまとめて 1 PR にする
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns: ["@types/react", "@types/react-dom"]
    # typescript は @typescript/typescript6(API 用、6.x のみ)、@typescript/native は typescript 7.x(tsc 用)の
    # エイリアス。TS 7 の major 更新はエイリアス側で追跡されるため、ignore は不要(#49)

  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "infra"]
