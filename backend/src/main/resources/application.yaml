spring:
  application:
    name: youtube-handle-id-converter
  http:
    clients:
      # 自動構成の RestClient.Builder に適用される(YouTube Data API 呼び出し)
      connect-timeout: 3s
      read-timeout: 5s

server:
  # Cloud Run は PORT 環境変数でリッスンポートを指定する。デフォルトは推測されやすい 8080 を避ける
  port: ${PORT:8180}
  shutdown: graceful

management:
  server:
    # Actuator はアプリケーションと別ポートで提供し、ingress(公開ポート)から到達できないようにする。
    # Cloud Run の startup / liveness probe はこのポートを直接指定する
    port: ${MANAGEMENT_PORT:8181}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

youtube:
  # Secret Manager → 環境変数 YOUTUBE_API_KEY。未設定なら起動時に検証エラーで落とす
  api-key: ${YOUTUBE_API_KEY:}

app:
  max-inputs: ${APP_MAX_INPUTS:100}
  # カンマ区切り。ローカル開発では Next.js の dev サーバーを許可する
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # 保護機構(運用者が環境変数で切り替える。docs/operations.md 参照)
  maintenance-mode: ${APP_MAINTENANCE_MODE:false}
  auth:
    enabled: ${APP_AUTH_ENABLED:false}
    username: ${APP_AUTH_USERNAME:}
    password: ${APP_AUTH_PASSWORD:}
  rate-limit-per-minute: ${APP_RATE_LIMIT_PER_MINUTE:30}

springdoc:
  # OpenAPI 定義のみ公開(Swagger UI は同梱しない)
  api-docs:
    path: /v3/api-docs
